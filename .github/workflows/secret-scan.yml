name: Secret scan

# Regression guard against credentials being committed to this repository.
#
# Why this shape:
#   This is a static landing page (HTML + images + a handful of config files)
#   with no build step and no dependencies. A full CI/security ecosystem would
#   cost more to maintain than it protects here, so the check is a single
#   dependency-free Python script committed alongside the site.
#
# What it detects:
#   Provider credential formats with a distinctive shape -- AWS keys, GitHub
#   tokens, Google API keys, Slack tokens, live Stripe keys, npm and SendGrid
#   tokens, OpenAI/Anthropic keys, any JWT (which is the shape a Supabase
#   service-role key takes), PEM private-key blocks, and secret-named variables
#   assigned long opaque literals.
#
# What it does NOT detect:
#   Secrets that look like ordinary text (a bare password, a short token), any
#   secret already present in history before this workflow was added, secrets
#   in binary files, or credentials leaked through a third party rather than
#   this repository. It is a net, not a guarantee.
#
# Operational notes:
#   Matched values are never printed -- findings report rule name, file and
#   line only, so a candidate secret is not copied into public CI logs.
#   GitHub's own secret scanning with push protection is free for public
#   repositories and blocks at push time rather than reporting after the fact;
#   it is the recommended primary control, with this workflow as a second net.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan working tree for committed credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        # Pinned to an immutable commit SHA rather than a moving tag, so the
        # action this security workflow runs cannot change under us. Resolved
        # from upstream git refs: refs/tags/v5.1.0 (and refs/tags/v5) both point
        # at this commit.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Run secret scan
        run: python3 .github/scripts/scan_secrets.py .
