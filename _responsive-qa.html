<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Responsive QA</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #ddd; }
    body { display: flex; flex-direction: column; align-items: flex-start; gap: 24px; padding: 16px; }
    .viewport { display: grid; gap: 8px; }
    strong { font: 700 14px/1.2 sans-serif; }
    iframe { display: block; height: 1000px; border: 0; outline: 2px solid #333; }
  </style>
</head>
<body>
  <div class="viewport"><strong>320px</strong><iframe data-width="320" width="320" src="/?qa=320" title="320px viewport"></iframe></div>
  <div class="viewport"><strong>375px</strong><iframe data-width="375" width="375" src="/?qa=375" title="375px viewport"></iframe></div>
  <div class="viewport"><strong>430px</strong><iframe data-width="430" width="430" src="/?qa=430" title="430px viewport"></iframe></div>
  <div class="viewport"><strong>768px</strong><iframe data-width="768" width="768" src="/?qa=768" title="Tablet viewport"></iframe></div>
  <div class="viewport"><strong>1280px</strong><iframe data-width="1280" width="1280" src="/?qa=1280" title="Desktop viewport"></iframe></div>
</body>
</html>
