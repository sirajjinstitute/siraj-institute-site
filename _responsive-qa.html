<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Temporary responsive QA</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: #eee; font: 14px sans-serif; }
  .case { margin: 0 0 24px; }
  .case h1 { margin: 0 0 8px; font-size: 16px; }
  iframe { display: block; height: 1000px; border: 2px solid #333; background: white; }
</style>
</head>
<body>
  <div class="case"><h1>320px</h1><iframe data-width="320" title="320px preview" src="/?qa=320" width="320"></iframe></div>
  <div class="case"><h1>375px</h1><iframe data-width="375" title="375px preview" src="/?qa=375" width="375"></iframe></div>
  <div class="case"><h1>430px</h1><iframe data-width="430" title="430px preview" src="/?qa=430" width="430"></iframe></div>
  <div class="case"><h1>768px</h1><iframe data-width="768" title="768px preview" src="/?qa=768" width="768"></iframe></div>
  <div class="case"><h1>1280px</h1><iframe data-width="1280" title="1280px preview" src="/?qa=1280" width="1280"></iframe></div>
</body>
</html>
